<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análise de Jogos</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<header>
  <h1>📊 Análise de Jogos</h1>
  <span id="quota" class="muted"></span>
  <button id="btnKey" class="ghost">⚙️ Chave</button>
</header>

<section id="keyBox" class="card" hidden>
  <label for="keyInput">Chave da API-Football (fica só neste navegador; digite <code>demo</code> para dados fictícios)</label>
  <div class="row">
    <input id="keyInput" type="password" autocomplete="off" placeholder="x-apisports-key">
    <button id="btnSaveKey">Salvar</button>
  </div>
</section>

<section class="card">
  <label for="teamInput">Time</label>
  <div class="row">
    <input id="teamInput" type="text" placeholder="Nome de um dos times do jogo">
    <button id="btnSearch">Buscar</button>
  </div>
  <select id="teamSel" hidden></select>
  <select id="fixSel" hidden></select>
  <div class="row">
    <button id="btnRun" class="primary" disabled>Analisar jogo</button>
  </div>
  <p id="msg" class="msg" hidden></p>
</section>

<main id="out" hidden>
  <section class="card">
    <h2 id="title"></h2>
    <p id="basis" class="muted"></p>
  </section>
  <section id="expect" class="cards"></section>
  <section class="card">
    <h2>Leitura do confronto</h2>
    <ul id="insights" class="insights"></ul>
  </section>
  <section class="card">
    <div class="row head">
      <h2>Painel: 5 linhas mais consistentes <span class="muted">acerto primeiro, preço depois · últimos 10 jogos de cada time</span></h2>
      <button id="btnOdds">🔄 Atualizar odds</button>
    </div>
    <p id="oddsInfo" class="oddsbar"></p>
    <div id="dashMode" class="chips"></div>
    <div id="dash"></div>
  </section>
  <section class="card">
    <h2>EV contra a odd informada <span class="muted">(Pinnacle ou digitada na tabela)</span></h2>
    <div id="rank"></div>
  </section>
  <section class="card">
    <div id="chips" class="chips"></div>
    <div class="scroll"><table id="lines"></table></div>
  </section>
  <section class="card">
    <h2>Últimos jogos na liga <span class="muted">(xG-proxy = chutes dentro/fora da área, calibrado na liga)</span></h2>
    <div id="games" class="teams"></div>
  </section>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
